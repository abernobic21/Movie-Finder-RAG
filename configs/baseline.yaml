name: baseline
data_path: data/processed/movies_5000.jsonl
chunker:
  type: token
  chunk_size: 200
  overlap: 40
embedder:
  type: sentence_transformer
  model: sentence-transformers/all-MiniLM-L6-v2
retriever:
  type: hybrid
  rrf_k: 60
candidate_chunks: 100
llm:
  type: groq
  model: openai/gpt-oss-120b
