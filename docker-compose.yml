services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /cache/huggingface
    volumes:
      - ./data/indexes:/app/data/indexes:ro
      - hf_cache:/cache/huggingface
    depends_on:
      - qdrant
    restart: on-failure

volumes:
  qdrant_data:
  hf_cache:
