[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-finder"
version = "0.1.0"
description = "RAG system that identifies movies from vague descriptions, with measured retrieval evaluation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "qdrant-client>=1.13,<1.14",
    "rank-bm25>=0.2.2,<0.3",
    "sentence-transformers>=5.7,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
